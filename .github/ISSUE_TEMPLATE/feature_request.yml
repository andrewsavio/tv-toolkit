name: Feature request
description: Suggest a change or a new capability
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: What should change? Keep it read-only and reversible if it touches a device.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: The proposal is read-only, or it changes the device only with an explicit flag and can be undone.
        - label: The proposal does not need vendor binaries or keys.
